<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --secondary-color: #0f172a;
            --accent-color: #059669;
            --danger-color: #dc2626;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.02);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.08);
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 70px;
        }

        .container {
            max-width: 1250px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Navbar */
        .navbar {
            background: var(--secondary-color);
            color: white;
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow-md);
        }
        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        .logo a {
            color: white;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: 800;
        }
        .logo span { color: var(--primary-color); }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .nav-links {
            display: flex;
            gap: 15px;
            list-style: none;
            overflow-x: auto;
            white-space: nowrap;
        }
        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .nav-links a:hover, .nav-links a.active { color: white; }

        .pi-btn {
            background-color: #7b1fa2;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .pi-btn:hover { background-color: #6a1b9a; }

        /* Hero & Search */
        .hero {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            padding: 45px 0;
            text-align: center;
            border-bottom-left-radius: var(--radius-lg);
            border-bottom-right-radius: var(--radius-lg);
        }
        .hero h2 { font-size: 2.2rem; margin-bottom: 10px; font-weight: 800; }
        .hero p { color: #94a3b8; margin-bottom: 25px; font-size: 1rem; }
        .search-box {
            max-width: 550px;
            margin: 0 auto;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 30px;
            border: 2px solid transparent;
            font-size: 1rem;
            font-family: inherit;
            box-shadow: var(--shadow-lg);
            outline: none;
        }
        .search-box input:focus { border-color: var(--primary-color); }

        /* Category Filter Tabs */
        .category-nav {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 20px 0 10px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .cat-tab {
            padding: 8px 16px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .cat-tab.active, .cat-tab:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* تنسيقات الإعلانات الذكية */
        .ad-header-wrapper { text-align: center; margin: 25px auto 10px auto; max-width: 728px; width: 100%; padding: 0 20px; }
        .native-ad-box { background: linear-gradient(90deg, #ff4757, #ff6b81); color: white; border-radius: var(--radius-md); padding: 15px; text-align: center; box-shadow: var(--shadow-md); text-decoration: none; display: block; transition: transform 0.2s; position: relative; overflow: hidden; }
        .native-ad-box:hover { transform: scale(1.01); }
        .native-ad-box h4 { font-size: 1.2rem; font-weight: 800; margin-bottom: 5px; }
        .native-ad-box p { font-size: 0.9rem; opacity: 0.9; }
        .ad-badge-native { position: absolute; top: 0; left: 0; background: rgba(0,0,0,0.2); color: white; font-size: 0.6rem; padding: 2px 8px; border-bottom-right-radius: 6px; text-transform: uppercase; font-weight: bold; }

        .native-sidebar-ad { background: linear-gradient(180deg, #1e293b, #0f172a); color: white; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 30px 20px; text-align: center; box-shadow: var(--shadow-md); text-decoration: none; display: flex; flex-direction: column; justify-content: center; height: 600px; width: 300px; box-sizing: border-box; transition: border-color 0.2s; }
        .native-sidebar-ad:hover { border-color: var(--primary-color); }
        .native-sidebar-ad .btn-ad { background: #ff4757; color: white; padding: 12px; border-radius: 8px; font-weight: 700; margin-top: 25px; display: block; text-transform: uppercase; }

        /* تقسيم التنسيق الشبكي */
        .main-layout { display: grid; grid-template-columns: 1fr 300px; gap: 25px; margin-top: 25px; }
        .content-area { min-width: 0; }
        .calculator-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .calc-card { background: var(--card-bg); border-radius: var(--radius-md); padding: 22px; border: 1px solid var(--border-color); box-shadow: var(--shadow-md); transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
        .calc-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
        .calc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .calc-card h3 { font-size: 1.15rem; color: var(--secondary-color); font-weight: 700; }
        .badge { font-size: 0.72rem; padding: 3px 8px; border-radius: 6px; background: var(--primary-light); color: var(--primary-dark); font-weight: 700; text-transform: uppercase; }

        /* المكونات الداخلية للحاسبات */
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: var(--text-main); }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 8px; font-family: inherit; font-size: 0.9rem; background: var(--bg-color); outline: none; }
        .form-group input:focus { border-color: var(--primary-color); background: white; }

        @media (max-width: 991px) {
            .main-layout { grid-template-columns: 1fr; }
            .native-sidebar-ad { width: 100%; height: auto; padding: 40px 20px; }
        }
    </style>
</head>
